# 构建 VitePress 站点并发布到 GitHub Pages
# 站点地址：https://blog.singlekobold.cn
# 注意：base 必须与站点实际部署路径一致（项目页为 "/docs/"，绑定自定义域名且位于
# 域名根目录时为 "/"），配置见 docs/.vitepress/config/index.mjs
name: Deploy VitePress site to Pages

on:
  # 推送到 main 分支时自动部署
  push:
    branches: [main]

  # 也可以在 Actions 页面手动触发
  workflow_dispatch:

# 允许 GITHUB_TOKEN 部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一次部署，但不打断正在进行的生产部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 构建
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 站点已关闭 lastUpdated（改用 frontmatter 的 date），不需要完整 git 历史
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # VitePress 2 依赖 Vite 8，要求 Node ^20.19 || >=22.12
          node-version: 22
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: npm ci

      - name: Build with VitePress
        run: npm run docs:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  # 部署
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
